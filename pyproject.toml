[project]
name = "castcomplete"
version = "1.0.0"
description = "Complete Chromecast playlist manager with multi-device support and web interface"
readme = "README.md"
requires-python = ">=3.11.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "flask==2.3.3",
    "flask-socketio==5.3.6",
    "m3u8==6.0.0",
    "playwright==1.32.0",
    "pychromecast==14.0.5",
    "pytest==7.3.1",
    "requests==2.32.3",
    "zeroconf==0.131.0",
]

[project.scripts]
castcomplete = "chromecast_web_playlist.cli:main"
castserver = "chromecast_web_playlist.web.server:run_server"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chromecast_web_playlist*"]
